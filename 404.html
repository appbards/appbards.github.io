<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | App Bards</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <script type="text/javascript">
      // GitHub Pages serves this file with HTTP 404 for any path without a file.
      // Every real page is a prerendered static file, so the only fixable misses
      // are trailing-slash and .html variants: send those to the clean URL once.
      // Anything else stays a real 404 (redirecting it to the SPA returned 200
      // with an error page, which Google reports as a soft 404).
      var l = window.location;
      var clean = l.pathname.replace(/\.html$/, '').replace(/\/+$/, '') || '/';
      if (clean !== l.pathname) {
        l.replace(clean + l.search + l.hash);
      }
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      main { text-align: center; padding: 24px 16px; }
      h1 { font-size: 2.25rem; margin: 0 0 12px; }
      p { font-size: 1.125rem; color: #6e6e73; margin: 0 0 20px; }
      a { color: #7c3aed; margin: 0 10px; }
      @media (prefers-color-scheme: dark) {
        body { background: #111114; color: #f5f5f7; }
        p { color: #a1a1a6; }
        a { color: #a78bfa; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This page doesn't exist on App Bards.</p>
      <a href="/">Home</a><a href="/apps">All apps</a><a href="/blog/">Blog</a>
    </main>
  </body>
</html>
